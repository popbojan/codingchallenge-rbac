spring.application.name=RBAC_Challenge

# Database Configuration
spring.datasource.url=jdbc:h2:file:./data/rbac_challenge_db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Liquibase Configuration
spring.liquibase.change-log=classpath:db/master-changelog.yaml

# Security
#   In-memory users. Passwords must be provided via environment variables:
#   export DEMO_ADMIN_PASSWORD='...'
#   export DEMO_USER_PASSWORD='...'
# Plain-text values are BCrypt-hashed at startup in SecurityConfig#userDetailsService.
security.users[0].username=admin
security.users[0].password=${DEMO_ADMIN_PASSWORD:}
security.users[0].roles[0]=ADMIN
security.users[1].username=user
security.users[1].password=${DEMO_USER_PASSWORD:}
security.users[1].roles[0]=USER