# Tests use an in-memory database to avoid file-locking and corruption
# when multiple test classes start the Spring context.
spring.datasource.url=jdbc:h2:mem:rbac_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.liquibase.change-log=classpath:db/master-changelog.yaml

# Test-only credentials (override env-var placeholders from main application.properties)
security.users[0].username=admin
security.users[0].password=admin
security.users[0].roles[0]=ADMIN
security.users[1].username=user
security.users[1].password=user
security.users[1].roles[0]=USER
